<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cadastro de Contato</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
  <main class="container">
    <h3 class="my-4">Cadastro de Novo Contato</h3>
    <form class="p-4 border rounded" action="cadastraContato.php" method="post">
      
      <div class="row mb-3">
        <div class="col-md-6">
          <label for="nome" class="form-label">Nome:</label>
          <input type="text" id="nome" name="nome" class="form-control" value="Fulano" required>
        </div>
        <div class="col-md-6">
          <label for="cpf" class="form-label">CPF:</label>
          <input type="text" id="cpf" name="cpf" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="email" class="form-label">E-mail:</label>
          <input type="email" id="email" name="email" class="form-control" required>
        </div>
        <div class="col-md-4">
          <label for="telefone" class="form-label">Telefone:</label>
          <input type="text" id="telefone" name="telefone" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="senha" class="form-label">Senha:</label>
          <input type="password" id="senha" name="senha" class="form-control" required>
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-3">
          <label for="cep" class="form-label">CEP:</label>
          <input type="text" id="cep" name="cep" class="form-control">
        </div>
        <div class="col-md-9">
          <label for="endereco" class="form-label">Endereço:</label>
          <input type="text" id="endereco" name="endereco" class="form-control" value="Avenida João Naves de Avila">
        </div>
      </div>

      <div class="row mb-3">
        <div class="col-md-4">
          <label for="bairro" class="form-label">Bairro:</label>
          <input type="text" id="bairro" name="bairro" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="cidade" class="form-label">Cidade:</label>
          <input type="text" id="cidade" name="cidade" class="form-control">
        </div>
        <div class="col-md-4">
          <label for="estado" class="form-label">Estado:</label>
          <select id="estado" name="estado" class="form-select" required>
            <option value="">Selecione o Estado</option>
            <option value="MG">MG</option>
            <option value="SP">SP</option>
            <option value="RJ">RJ</option>
            <option value="GO">GO</option>
          </select>
        </div>
      </div>

      <button type="submit" class="btn btn-primary">Cadastrar</button>
      <a href="index.html" class="btn btn-secondary">Voltar</a>

    </form>
  </main>
</body>
</html>
